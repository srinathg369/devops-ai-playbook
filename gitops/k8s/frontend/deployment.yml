apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 441214867406.dkr.ecr.ap-southeast-2.amazonaws.com/frontend:35d8379d5a99dfb66b5348ec6ef1d8c87318774c
          ports:
            - containerPort: 3000
          # Only send traffic once the app answers.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
---
# Public AWS Network Load Balancer in front of the shop.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: boutique
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer

