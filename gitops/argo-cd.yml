apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/srinathg369/devops-ai-playbook.git'
    targetRevision: main
    path: gitops
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: boutique
  # Deploy every new commit on main automatically.
  # prune: delete resources that were removed from Git.
  # selfHeal: undo manual changes made directly in the cluster.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
